name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BitClock v${{ steps.version.outputs.version }}
          body: |
            ## BitClock v${{ steps.version.outputs.version }}

            ### 安装说明
            - 下载 `BitClock_${{ steps.version.outputs.version }}_x64-setup.exe` 运行安装
            - 支持 Windows 10/11

            ### 更新内容
            - 详见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/README.md#更新日志)
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run build

      - name: Check Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cd src-tauri && cargo fmt --check

      - name: Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cd src-tauri && cargo clippy -- -D warnings

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cd src-tauri && cargo test
